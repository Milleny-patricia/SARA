<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Sara ✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas { display: block; }
        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 1s;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="hint">clique para ativar o som</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Post-processing para Bloom -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ============================================================
        // CONFIGURAÇÃO BASE
        // ============================================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // BLOOM (brilho real)
        // ============================================================
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.4,   // strength — força do brilho
            0.9,   // radius
            0.05   // threshold
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ============================================================
        // PARTÍCULAS
        // ============================================================
        const particleCount = 80000;
        const geometry = new THREE.BufferGeometry();
        const heartPositions = new Float32Array(particleCount * 3);
        const scatterPositions = new Float32Array(particleCount * 3);
        const currentPositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        // Variação individual de cada partícula (para pulsar)
        const phaseOffsets = new Float32Array(particleCount);

        // ============================================================
        // FORMA DO CORAÇÃO (volume 3D)
        // ============================================================
        function heartXY(t) {
            return {
                x: 16 * Math.pow(Math.sin(t), 3),
                y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
            };
        }

        const SILHOUETTE_SAMPLES = 400;
        const silhouette = [];
        for (let i = 0; i < SILHOUETTE_SAMPLES; i++) {
            silhouette.push(heartXY((i / SILHOUETTE_SAMPLES) * Math.PI * 2));
        }

        function isInsideHeart(x, y) {
            let inside = false;
            for (let i = 0, j = silhouette.length - 1; i < silhouette.length; j = i++) {
                const xi = silhouette[i].x, yi = silhouette[i].y;
                const xj = silhouette[j].x, yj = silhouette[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }

        function getRandomHeartVolumePoint() {
            const scale = 0.8, maxR = 18;
            while (true) {
                const x = (Math.random() * 2 - 1) * maxR;
                const y = (Math.random() * 2 - 1) * maxR;
                if (isInsideHeart(x, y)) {
                    let minDistToEdge = Infinity;
                    for (let i = 0; i < silhouette.length; i++) {
                        const dx = x - silhouette[i].x, dy = y - silhouette[i].y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < minDistToEdge) minDistToEdge = d;
                    }
                    const depthFactor = Math.min(minDistToEdge / 8, 1);
                    const z = (Math.random() * 2 - 1) * 6.5 * depthFactor;
                    return new THREE.Vector3(x * scale, y * scale, z * scale);
                }
            }
        }

        // ============================================================
        // TEXTO "SARA" (vermelho)
        // ============================================================
        const textCanvas = document.createElement('canvas');
        const textCtx = textCanvas.getContext('2d');
        const canvasW = 600, canvasH = 200;
        textCanvas.width = canvasW;
        textCanvas.height = canvasH;
        textCtx.fillStyle = 'black';
        textCtx.fillRect(0, 0, canvasW, canvasH);
        textCtx.fillStyle = 'white';
        textCtx.font = 'bold 180px Arial Black, sans-serif';
        textCtx.textAlign = 'center';
        textCtx.textBaseline = 'middle';
        textCtx.fillText('SARA', canvasW / 2, canvasH / 2);

        const textImageData = textCtx.getImageData(0, 0, canvasW, canvasH).data;
        const textPoints = [];
        for (let y = 0; y < canvasH; y += 2) {
            for (let x = 0; x < canvasW; x += 2) {
                if (textImageData[(y * canvasW + x) * 4] > 128) {
                    textPoints.push({
                        x: ((x / canvasW) - 0.5) * 24,
                        y: -(((y / canvasH) - 0.5) * 8)
                    });
                }
            }
        }

        // ============================================================
        // PLANETAS
        // ============================================================
        const planets = [
            { center: new THREE.Vector3(-18, 8, 0), radius: 5, ring: false,
              colorBase: new THREE.Color(0x1e90ff), colorAlt: new THREE.Color(0x2e8b57), colorDeep: new THREE.Color(0x0a2a5c), type: 'earth' },
            { center: new THREE.Vector3(18, 6, 2), radius: 3, ring: false,
              colorBase: new THREE.Color(0x888888), colorAlt: new THREE.Color(0xaaaaaa), colorDeep: new THREE.Color(0x555555), type: 'mercury' },
            { center: new THREE.Vector3(0, -12, 0), radius: 5, ring: true,
              colorBase: new THREE.Color(0xe0c896), colorAlt: new THREE.Color(0xd4b483), colorDeep: new THREE.Color(0xb89a6e), type: 'saturn' }
        ];

        const planetPoints = [];
        planets.forEach(p => {
            for (let i = 0; i < 6000; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = p.radius * (0.95 + Math.random() * 0.1);
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                let color;
                const rand = Math.random();
                if (p.type === 'earth') {
                    color = rand < 0.35 ? p.colorAlt.clone().lerp(new THREE.Color(0x8b6f47), Math.random())
                          : rand < 0.85 ? p.colorBase.clone().lerp(p.colorDeep, Math.random() * 0.7)
                          : new THREE.Color(0xffffff);
                } else if (p.type === 'mercury') {
                    color = p.colorBase.clone().lerp(p.colorDeep, Math.random());
                    if (rand < 0.15) color = new THREE.Color(0x333333);
                } else {
                    const band = Math.sin(y * 3) * 0.5 + 0.5;
                    color = p.colorBase.clone().lerp(p.colorAlt, band);
                    color.lerp(p.colorDeep, Math.random() * 0.4);
                }
                planetPoints.push({
                    pos: new THREE.Vector3(p.center.x + x, p.center.y + y, p.center.z + z),
                    color, size: 0.15 + Math.random() * 0.15
                });
            }
            if (p.ring) {
                for (let i = 0; i < 5000; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const ringR = p.radius * (1.4 + Math.random() * 1.2);
                    const x = ringR * Math.cos(angle);
                    const z = ringR * Math.sin(angle);
                    const y = (Math.random() - 0.5) * 0.3;
                    const tiltX = x * Math.cos(0.4) - y * Math.sin(0.4);
                    const tiltY = x * Math.sin(0.4) + y * Math.cos(0.4);
                    const rand = Math.random();
                    const color = rand < 0.5 ? new THREE.Color(0xe8d5a8)
                                : rand < 0.8 ? new THREE.Color(0xc9b382)
                                : new THREE.Color(0x8b7d5a);
                    planetPoints.push({
                        pos: new THREE.Vector3(p.center.x + tiltX, p.center.y + tiltY, p.center.z + z),
                        color, size: 0.12 + Math.random() * 0.12
                    });
                }
            }
        });

        const textCount = textPoints.length;
        const planetCount = planetPoints.length;
        const remainingCount = particleCount - textCount - planetCount;

        // ============================================================
        // PREENCHER CORES E POSIÇÕES
        // ============================================================
        const redBright = new THREE.Color(0xff2a2a);
        const redHot = new THREE.Color(0xff6b6b);
        const redDeep = new THREE.Color(0xaa0000);

        let pIdx = 0;

        // Texto SARA — vermelho no "coração", mantém vermelho no espalhado também
        for (let i = 0; i < textCount; i++) {
            const tp = textPoints[i];
            const hp = getRandomHeartVolumePoint();
            heartPositions[pIdx * 3] = hp.x;
            heartPositions[pIdx * 3 + 1] = hp.y;
            heartPositions[pIdx * 3 + 2] = hp.z;
            scatterPositions[pIdx * 3] = tp.x;
            scatterPositions[pIdx * 3 + 1] = tp.y + 2;
            scatterPositions[pIdx * 3 + 2] = (Math.random() - 0.5) * 1.5;
            currentPositions[pIdx * 3] = hp.x;
            currentPositions[pIdx * 3 + 1] = hp.y;
            currentPositions[pIdx * 3 + 2] = hp.z;
            const c = new THREE.Color(0xff0000).lerp(new THREE.Color(0xff5555), Math.random());
            colors[pIdx * 3] = c.r; colors[pIdx * 3 + 1] = c.g; colors[pIdx * 3 + 2] = c.b;
            particleSizes[pIdx] = 0.3 + Math.random() * 0.3;
            phaseOffsets[pIdx] = Math.random() * Math.PI * 2;
            pIdx++;
        }

        // Planetas
        for (let i = 0; i < planetCount; i++) {
            const pp = planetPoints[i];
            const hp = getRandomHeartVolumePoint();
            heartPositions[pIdx * 3] = hp.x;
            heartPositions[pIdx * 3 + 1] = hp.y;
            heartPositions[pIdx * 3 + 2] = hp.z;
            scatterPositions[pIdx * 3] = pp.pos.x;
            scatterPositions[pIdx * 3 + 1] = pp.pos.y;
            scatterPositions[pIdx * 3 + 2] = pp.pos.z;
            currentPositions[pIdx * 3] = hp.x;
            currentPositions[pIdx * 3 + 1] = hp.y;
            currentPositions[pIdx * 3 + 2] = hp.z;
            colors[pIdx * 3] = pp.color.r; colors[pIdx * 3 + 1] = pp.color.g; colors[pIdx * 3 + 2] = pp.color.b;
            particleSizes[pIdx] = pp.size;
            phaseOffsets[pIdx] = Math.random() * Math.PI * 2;
            pIdx++;
        }

        // Estrelas (brancas na explosão)
        for (let i = 0; i < remainingCount; i++) {
            const hp = getRandomHeartVolumePoint();
            heartPositions[pIdx * 3] = hp.x;
            heartPositions[pIdx * 3 + 1] = hp.y;
            heartPositions[pIdx * 3 + 2] = hp.z;
            const radius = 30 + Math.random() * 60;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            scatterPositions[pIdx * 3] = radius * Math.sin(phi) * Math.cos(theta);
            scatterPositions[pIdx * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            scatterPositions[pIdx * 3 + 2] = radius * Math.cos(phi);
            currentPositions[pIdx * 3] = hp.x;
            currentPositions[pIdx * 3 + 1] = hp.y;
            currentPositions[pIdx * 3 + 2] = hp.z;

            const rand = Math.random();
            const c = rand < 0.15 ? new THREE.Color(0xeef4ff)
                    : rand < 0.55 ? new THREE.Color(0xffffff)
                    : new THREE.Color(0xfff5f5);
            colors[pIdx * 3] = c.r; colors[pIdx * 3 + 1] = c.g; colors[pIdx * 3 + 2] = c.b;
            particleSizes[pIdx] = Math.random() < 0.08 ? 0.3 + Math.random() * 0.4 : 0.1 + Math.random() * 0.15;
            phaseOffsets[pIdx] = Math.random() * Math.PI * 2;
            pIdx++;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
        geometry.setAttribute('aPhase', new THREE.BufferAttribute(phaseOffsets, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uPixelRatio: { value: window.devicePixelRatio },
                uTime: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                attribute float aPhase;
                varying vec3 vColor;
                varying float vTwinkle;
                uniform float uPixelRatio;
                uniform float uTime;
                void main() {
                    vColor = color;
                    // Cintilação estelar
                    vTwinkle = 0.75 + 0.25 * sin(uTime * 2.5 + aPhase);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * uPixelRatio * vTwinkle * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vTwinkle;
                void main() {
                    vec2 c = gl_PointCoord - vec2(0.5);
                    float d = length(c);
                    if (d > 0.5) discard;
                    float alpha = smoothstep(0.5, 0.0, d);
                    float core = smoothstep(0.25, 0.0, d);
                    vec3 finalColor = vColor + vec3(core * 0.6);
                    gl_FragColor = vec4(finalColor, alpha * vTwinkle);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const heartParticles = new THREE.Points(geometry, material);
        scene.add(heartParticles);

        // ============================================================
        // POEIRA ESTELAR (partículas de fundo o tempo todo)
        // ============================================================
        const dustCount = 3000;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustSize = new Float32Array(dustCount);
        for (let i = 0; i < dustCount; i++) {
            const r = 60 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            dustPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            dustPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            dustPos[i * 3 + 2] = r * Math.cos(phi);
            dustSize[i] = 0.15 + Math.random() * 0.4;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustGeo.setAttribute('size', new THREE.BufferAttribute(dustSize, 1));

        const dustMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.4,
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);

        // ============================================================
        // SOM AMBIENTE (opcional — só toca se clicar)
        // ============================================================
        let audioCtx = null;
        let soundOn = false;
        const hint = document.getElementById('hint');

        function startAmbient() {
            if (soundOn) return;
            soundOn = true;
            hint.style.opacity = '0';

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Pad suave de fundo (dois osciladores em quinta)
            const freq = [110, 164.81, 220]; // A2, E3, A3
            freq.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                gain.gain.value = 0.04;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                // LFO suave
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = 0.1 + i * 0.05;
                lfoGain.gain.value = 0.02;
                lfo.connect(lfoGain);
                lfoGain.connect(gain.gain);
                lfo.start();
            });
        }

        window.addEventListener('click', startAmbient, { once: true });
        window.addEventListener('touchstart', startAmbient, { once: true });

        // ============================================================
        // ANIMAÇÃO
        // ============================================================
        let time = 0, progress = 0, direction = 1, holdTimer = 0;
        const transitionSpeed = 0.005;
        const holdTime = 150;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            if (holdTimer > 0) holdTimer--;
            else {
                progress += direction * transitionSpeed;
                if (progress >= 1) { progress = 1; direction = -1; holdTimer = holdTime; }
                else if (progress <= 0) { progress = 0; direction = 1; holdTimer = holdTime; }
            }

            const smoothProgress = progress * progress * (3 - 2 * progress);
            const positions = geometry.attributes.position.array;

            // Batimento cardíaco (pulsa apenas quando progress está perto de 0)
            const heartScale = 1 + Math.sin(time * 3) * 0.02 * (1 - smoothProgress);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const tx = (heartPositions[i3] * (1 - smoothProgress) + scatterPositions[i3] * smoothProgress) * heartScale;
                const ty = (heartPositions[i3 + 1] * (1 - smoothProgress) + scatterPositions[i3 + 1] * smoothProgress) * heartScale;
                const tz = (heartPositions[i3 + 2] * (1 - smoothProgress) + scatterPositions[i3 + 2] * smoothProgress) * heartScale;

                const noise = Math.sin(time * 0.5 + i * 0.5) * smoothProgress * 0.15;
                positions[i3] = tx + noise;
                positions[i3 + 1] = ty + noise;
                positions[i3 + 2] = tz + noise;
            }
            geometry.attributes.position.needsUpdate = true;

            // Atualiza tempo do shader (cintilação)
            material.uniforms.uTime.value = time;

            // Rotação do conjunto
            heartParticles.rotation.y += 0.002 + (1 - smoothProgress) * 0.004;

            // Poeira girando lentamente
            dust.rotation.y += 0.0004;
            dust.rotation.x += 0.0002;

            // Câmera cinematográfica suave
            camera.position.x = Math.sin(time * 0.15) * 7;
            camera.position.y = Math.cos(time * 0.12) * 4;
            camera.lookAt(scene.position);

            // Renderiza com bloom
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uPixelRatio.value = window.devicePixelRatio;
        });

        animate();
    </script>
</body>
</html>
